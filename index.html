<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Isu Nasional Indonesia 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .badge-type { background-color: #0d6efd; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold">Database Isu Nasional & Referensi Akademis 2026</h1>
            <p class="lead text-muted">Sumber data Open Access otomatis terintegrasi untuk Web Hosting GitHub</p>
        </div>

        <div class="row mb-4">
            <div class="col-md-3">
                <button onclick="filterTopic('all')" class="btn btn-dark w-100 mb-2">Semua Topik</button>
            </div>
            <div class="col-md-3">
                <button onclick="filterTopic('karhutla_lengkap')" class="btn btn-danger w-100 mb-2">Karhutla Lengkap</button>
            </div>
            <div class="col-md-3">
                <button onclick="filterTopic('nepotisme_dinasti')" class="btn btn-primary w-100 mb-2">Nepotisme & Politik</button>
            </div>
            <div class="col-md-3">
                <button onclick="filterTopic('presiden_indonesia')" class="btn btn-warning w-100 mb-2">Presiden Indonesia (Baru)</button>
            </div>
        </div>

        <div id="content-area" class="row"></div>
    </div>

    <script>
        let webData = {};

        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                webData = data;
                renderData('all');
            })
            .catch(err => console.error("Gagal memuat data:", err));

        function renderData(filter) {
            const container = document.getElementById('content-area');
            container.innerHTML = '';

            let itemsToRender = [];
            if (filter === 'all') {
                for (let category in webData) {
                    itemsToRender = itemsToRender.concat(webData[category]);
                }
            } else {
                itemsToRender = webData[filter] || [];
            }

            if (itemsToRender.length === 0) {
                container.innerHTML = '<div class="col-12 text-center"><p class="text-muted">Tidak ada data tersedia.</p></div>';
                return;
            }

            itemsToRender.forEach(item => {
                const cardHtml = `
                    <div class="col-md-6 col-lg-4">
                        <div class="card h-100">
                            <div class="card-body d-flex flex-column">
                                <h6 class="card-title fw-bold text-dark">${item.title}</h6>
                                <p class="text-muted small mb-2">Tahun: ${item.year || '-'} | Sitasi: ${item.citations}</p>
                                <div class="mb-3">
                                    <span class="badge badge-type text-uppercase small">${item.type || 'Article'}</span>
                                </div>
                                <div class="mt-auto">
                                    ${item.url ? `<a href="${item.url}" target="_blank" class="btn btn-outline-success btn-sm w-100">Baca/Unduh Gratis</a>` : '<span class="text-danger">Link Tidak Tersedia</span>'}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        function filterTopic(topic) {
            renderData(topic);
        }
    </script>
</body>
</html>
